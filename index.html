





<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gurbani Ras Live 3D Logo</title>

<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}

body {

    background: transparent;

    overflow: hidden;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

}

.stage {

    width: 300px;

    height: 300px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

}

.ring {

    position: absolute;

    inset: 0;

    border: 5px solid #ffc72c;

    border-radius: 50%;

    box-shadow: 0 0 15px gold, 0 0 35px orange;

    animation: glow 2s infinite alternate;

}

.logo-frame {

    width: 88%;

    height: 88%;

    border-radius: 50%;

    overflow: hidden;

    position: relative;

    z-index: 2;

    animation: float 3s ease-in-out infinite alternate;

    filter: drop-shadow(0 0 12px gold);

}

.logo {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 50%;

}

.orbit {

    position: absolute;

    width: 115%;

    height: 35%;

    border: 3px solid gold;

    border-radius: 50%;

    transform: rotate(-25deg);

    box-shadow: 0 0 15px gold;

    animation: orbit 5s linear infinite;

}

@keyframes float {

    from { transform: translateY(-5px) rotateZ(-3deg); }

    to { transform: translateY(5px) rotateZ(3deg); }

}

@keyframes orbit {

    from { transform: rotate(-25deg); }

    to { transform: rotate(335deg); }

}

@keyframes glow {

    from { box-shadow: 0 0 10px gold; }

    to { box-shadow: 0 0 35px orange, 0 0 55px gold; }

}

</style>

</head>

<body>

<div class="stage">

    <div class="ring"></div>

    <div class="orbit"></div>

    <div class="logo-frame">

        <img class="logo" src="logo.PNG" alt="Gurbani Ras Live">

    </div>

</div>

</body>

</html>
