

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gurbani Ras Live 3D Logo</title>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {

    background: transparent;

    overflow: hidden;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    perspective: 1200px;

}

.stage {

    width: 300px;

    height: 300px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    transform-style: preserve-3d;

}

.ring {

    position: absolute;

    inset: 0;

    border: 5px solid #ffc72c;

    border-radius: 50%;

    box-shadow: 0 0 15px gold, 0 0 35px orange;

    animation: glow 2s infinite alternate;

}

.logo {

    width: 88%;

    height: 88%;

    object-fit: contain;

    position: relative;

    z-index: 2;

    animation: rotate 8s linear infinite;

    filter: drop-shadow(0 0 12px gold);

    transform-style: preserve-3d;

}

.orbit {

    position: absolute;

    width: 115%;

    height: 35%;

    border: 3px solid gold;

    border-radius: 50%;

    transform: rotate(-25deg);

    box-shadow: 0 0 15px gold;

    animation: orbit 5s linear infinite;

}

@keyframes rotate {

    from { transform: rotateY(0deg); }

    to { transform: rotateY(360deg); }

}

@keyframes orbit {

    from { transform: rotate(-25deg); }

    to { transform: rotate(335deg); }

}

@keyframes glow {

    from { box-shadow: 0 0 10px gold; }

    to { box-shadow: 0 0 35px orange, 0 0 55px gold; }

}

</style>

</head>

<body>

<div class="stage">

    <div class="ring"></div>

    <div class="orbit"></div>

    <img class="logo" src="logo.png" alt="Gurbani Ras Live">

</div>

</body>

</html>
